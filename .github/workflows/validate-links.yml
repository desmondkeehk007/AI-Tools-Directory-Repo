name: Validate Directory Links

on:
  push:
    branches: [ main, master ]
    paths:
      - 'README.md'
      - '.github/workflows/validate-links.yml'
      - 'lychee.toml'
  pull_request:
    branches: [ main, master ]
    paths:
      - 'README.md'
  schedule:
    # Runs automatically every Monday at 00:00 UTC
    - cron: '0 0 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check-links:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Markdown Links with Lychee
        id: lychee
        uses: lycheeverse/lychee-action@v2
        with:
          args: --config lychee.toml './README.md'
          fail: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create Issue on Broken Link Detection (Scheduled Runs Only)
        if: env.lychee_exit_code != 0 && github.event_name == 'schedule'
        uses: peter-evans/create-issue-from-file@v5
        with:
          title: "Automated Alert: Broken URLs Detected in AI Tools Directory"
          content-filepath: ./lychee/out.md
          labels: bug, automated-issue